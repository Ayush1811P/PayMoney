[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8888
  publish = "."

[[headers]]
  for = "/PayMoney.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"PayMoney.apk\""
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/paymoney.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"PayMoney.apk\""
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/paymoney.apk"
  to = "/PayMoney.apk"
  status = 200
