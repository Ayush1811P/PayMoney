<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAYMONEY - Family & Lite Accounts</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/logo.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    .lite-account-card {
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
    }
    .lite-account-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-sm);
      border-bottom: 1px solid var(--border-color);
    }
    .lite-account-header h3 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lite-balance {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-color);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }
    .lite-balance-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 44px;
      margin-bottom: var(--spacing-md);
    }
    .send-child-money-btn {
      position: relative;
      z-index: 1;
    }
    .parent-transfer-modal-content h3 {
      margin-bottom: var(--spacing-lg);
      color: var(--secondary-color);
    }
    @media (max-width: 420px) {
      .lite-balance-row {
        min-height: 76px;
        align-items: flex-end;
      }
      .lite-balance {
        top: 0;
        font-size: 1.15rem;
      }
      .send-child-money-btn {
        width: 100%;
      }
    }
    .lite-transactions-container {
      background-color: var(--bg-light);
      border-radius: var(--border-radius-md);
      padding: var(--spacing-md);
      max-height: 400px;
      overflow-y: auto;
    }
    .lite-txn-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .lite-txn-item:last-child {
      border-bottom: none;
    }
    .txn-details p {
      margin: 0;
    }
    .txn-details p.title {
      font-weight: 600;
      color: var(--text-dark);
    }
    .txn-details p.date {
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .txn-amount {
      font-weight: 700;
    }
    .txn-amount.debit {
      color: var(--error-color);
    }
    .txn-amount.credit {
      color: var(--success-color);
    }
    @media (max-width: 520px) {
      .main-header .user-menu {
        gap: 8px;
        margin-right: 0;
      }
      .family-dashboard-back {
        margin-right: 0 !important;
        padding: 6px 8px;
        font-size: var(--font-size-xs);
        white-space: nowrap;
      }
    }
    @media (max-width: 360px) {
      .family-dashboard-back-context {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="main-header">
    <div class="header-content">
      <div class="logo">
        <a href="dashboard.html" class="paymoney-logo">
          <span class="logo-text-css">
            <span class="pay-part">PAY</span><span class="money-part">MONEY</span>
          </span>
        </a>
      </div>
      
      <div class="user-menu">
        <a href="dashboard.html" class="btn btn-outline family-dashboard-back" aria-label="Back to Dashboard" style="margin-right: 15px;"><span>Back</span><span class="family-dashboard-back-context"> to Dashboard</span></a>
        <button id="logoutBtn" class="btn btn-outline">Logout</button>
      </div>
    </div>
  </header>
  
  <main class="dashboard-container" style="margin-top: 40px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
      <h2>👪 Linked Lite Accounts (Parent Monitoring)</h2>
    </div>

    <div id="liteAccountsList">
      <!-- Loading state -->
      <p style="text-align: center; color: var(--text-light); margin: 40px 0;">Loading linked accounts...</p>
    </div>
  </main>

  <div id="parentTransferModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="parentTransferTitle">
    <div class="modal-content parent-transfer-modal-content">
      <button type="button" id="closeParentTransferModal" class="close-modal" aria-label="Close">&times;</button>
      <h3 id="parentTransferTitle">Send money to child</h3>
      <form id="parentTransferForm">
        <div class="form-group">
          <label for="parentTransferAmount">Amount (₹)</label>
          <input type="text" id="parentTransferAmount" inputmode="decimal" pattern="[0-9]+(\.[0-9]{1,2})?" required placeholder="Enter amount">
        </div>
        <div class="confirmation-actions">
          <button type="button" id="cancelParentTransfer" class="btn btn-outline">Cancel</button>
          <button type="submit" id="confirmParentTransfer" class="btn btn-primary">Continue to PIN</button>
        </div>
      </form>
    </div>
  </div>
  
  <div id="notification" class="notification"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/family-dashboard.js"></script>
</body>
</html>
